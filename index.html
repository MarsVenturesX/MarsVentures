<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mars Ventures</title>
  <meta name="description" content="Mars Ventures designs, builds, and scales the future of tech on a global scale." />

  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Mars" />
  <link rel="manifest" href="/site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@300;400;600;800&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/cursor.css">
  <link rel="stylesheet" href="assets/css/style.css">

  <link rel="preload" href="/assets/png/earth-horizon.png" as="image">
  <link rel="preload" href="/assets/png/stars.png" as="image">
  <link rel="preload" href="/assets/png/mars-league.png" as="image">
  <link rel="preload" href="/assets/png/nebula.png" as="image">
  <link rel="preload" href="/assets/png/mars-horizon.png" as="image">
</head>

<body>
  <div class="space-bg">
    <div class="bg-earth"></div>
    <div class="bg-mars-league"></div>
    <div class="bg-stars"></div>
    <div class="bg-mars-horizon"></div>
    <div class="bg-nebula"></div>
  </div>

  <main class="hero hero--home">
    <div class="stars" aria-hidden="true"></div>
    <div class="stars2" aria-hidden="true"></div>
    <div class="stars3" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>

    <!-- ==================== MAIN NAV ==================== -->
    <nav class="main-nav">
      <div class="nav-container">
        <a href="index.html" class="logo">
          <img src="assets/png/logo.png" alt="Mars Ventures" />
          <span class="logo-text">Mars Ventures</span>
        </a>

        <ul class="nav-menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>

        <a href="contact.html" class="cta-button-nav">Book a Call</a>
      </div>
    </nav>

    <!-- ==================== FULL-SCREEN IMMERSIVE HERO (SpaceX style) ==================== -->
    <section class="hero-fullscreen">
      <div class="hero-content-left">
        <h1 class="hero-headline">
          SHOOT FOR<br>
          THE STARS
        </h1>

        <p class="hero-subtext">
          We design, build, fund, and scale the future tech companies on a global scale.
        </p>

        <div class="hero-ctas">
          <a href="contact.html" class="cta-primary">
            Book a Call
            <span class="arrow">→</span>
          </a>
          <a href="services.html" class="cta-secondary">
            Explore Services
          </a>
        </div>
      </div>
    </section>

    <!-- Minimal footer at bottom of viewport -->
    <footer class="site-footer">
      © <span id="year"></span> Mars Ventures by <a href="https://roycemars.com">Royce Mars</a>
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

  <script defer src="assets/js/cursor.js"></script>

  <script>
    // Simple hamburger toggle
    document.querySelector('.main-nav').addEventListener('click', function (e) {
      if (e.target.tagName === 'A' || window.innerWidth > 768) return;
      this.classList.toggle('open');
    });
  </script>
</body>

</html>
